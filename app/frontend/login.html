<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Colegios El Alto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
<main class="login">
  <form id="login" class="card" novalidate>
    <h1>Unidades Educativas · El Alto</h1>
    <p class="muted">Ingresa con tu usuario para ver el dashboard.</p>
    <label>Usuario <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Contraseña <input id="clave" name="clave" type="password" autocomplete="current-password" required></label>
    <div id="login-error" class="estado" role="alert" hidden></div>
    <button type="submit" class="primario">Ingresar</button>
  </form>
</main>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
