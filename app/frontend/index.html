<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegios El Alto</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>Unidades Educativas · El Alto</h1>
  <span id="fuente" class="muted"></span>
  <nav class="exports">
    <a data-export="csv" href="#" download>CSV</a>
    <a data-export="xlsx" href="#" download>Excel</a>
    <a data-export="pdf" href="#" download>PDF</a>
  </nav>
</header>

<main class="layout">
  <aside class="filters" aria-label="Filtros">
   <details id="panel-filtros" open>
    <summary>Filtros <span id="filtros-activos" class="muted"></span></summary>
    <div class="filters-body">
    <label>Buscar <input id="q" type="search" placeholder="Nombre, dirección, RUE…"></label>
    <fieldset><legend>Dependencia</legend><div id="f-dependencia" class="chips"></div></fieldset>
    <fieldset><legend>Subsistema</legend><div id="f-subsistema" class="chips"></div></fieldset>
    <fieldset><legend>Nivel</legend><div id="f-nivel" class="chips"></div></fieldset>
    <fieldset><legend>Turno</legend><div id="f-turno" class="chips"></div></fieldset>
    <fieldset><legend>Distrito</legend><div id="f-distrito" class="chips"></div></fieldset>
    <button id="limpiar" type="button">Limpiar filtros</button>
    </div>
   </details>
  </aside>

  <section class="content" aria-busy="true">
    <div id="estado" class="estado" role="alert" hidden></div>
    <div class="kpis" id="kpis" aria-live="polite"></div>

    <div class="grid2">
      <div class="card"><h2>Mapa</h2><div class="map-wrap"><div id="map"></div><p id="map-vacio" class="map-vacio" hidden>Sin unidades con coordenadas para estos filtros.</p></div><div id="legend" class="legend"></div></div>
      <div class="card"><h2>Unidades por distrito y dependencia</h2><canvas id="ch-distrito"></canvas></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Dependencia</h2><canvas id="ch-dep"></canvas></div>
      <div class="card"><h2>Oferta por nivel</h2><canvas id="ch-nivel"></canvas></div>
    </div>

    <div class="card">
      <h2>Listado <span id="count" class="muted"></span></h2>
      <div class="table-wrap">
        <table id="tabla">
          <thead><tr>
            <th data-orden="nombre" aria-sort="ascending"><button type="button">Nombre</button></th>
            <th data-orden="distrito_municipal" aria-sort="none"><button type="button">Dist.</button></th>
            <th data-orden="dependencia" aria-sort="none"><button type="button">Dependencia</button></th>
            <th>Dirección</th><th>Nivel</th><th>Turno</th>
            <th data-orden="estudiantes_total" aria-sort="none" class="num col-matricula"><button type="button">Estudiantes</button></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager"><button id="prev" type="button" aria-label="Página anterior">‹</button><span id="pageinfo" aria-live="polite"></span><button id="next" type="button" aria-label="Página siguiente">›</button></div>
    </div>
  </section>
</main>

<dialog id="detalle" aria-labelledby="detalle-titulo"><form method="dialog"><button class="close" aria-label="Cerrar">×</button></form><div id="detalle-body"></div></dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
